name: pipeline-consumer
on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Public image pinned as ghcr.io/kurondt/norsign@sha256:<digest>'
        required: true
        type: string
permissions:
  contents: read
jobs:
  consumer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: ed25519
            secret: CONSUMER_SIGNING_KEY_ED25519
          - profile: ecdsa-p256-sha256
            secret: CONSUMER_SIGNING_KEY_ECDSA_P256
          - profile: rsa-pss-sha256
            secret: CONSUMER_SIGNING_KEY_RSA_PSS
    steps:
      - uses: actions/checkout@v4
      - name: C01-C05 using the published image
        env:
          IMAGE: ${{ inputs.image }}
          PROFILE: ${{ matrix.profile }}
          CONSUMER_SIGNING_KEY: ${{ secrets[matrix.secret] }}
        run: python3 scripts/consumer.py --image "$IMAGE" --profile "$PROFILE" --out consumer-results
      - name: Preserve sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-${{ matrix.profile }}
          path: consumer-results
          if-no-files-found: warn
