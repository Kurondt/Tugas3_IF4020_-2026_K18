name: release-image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kurondt/norsign

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PROGRAM_VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

      - name: Record digest
        run: |
          echo "image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "digest: ${{ steps.push.outputs.digest }}"
          echo "digest=${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"
          docker pull --platform linux/amd64 "$IMAGE"
          docker run --rm --network none "$IMAGE" --version
          docker run --rm --network none "$IMAGE" --help
