name: release-image
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing source release tag, e.g. v1.0.0'
        required: true
        default: v1.0.0
permissions:
  contents: read
  packages: write
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/kurondt/norsign
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Validate source identity
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" == main ]]; then
            echo "VERSION=dev" >> "$GITHUB_ENV"
          else
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
            echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          fi
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: make check
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          build-args: PROGRAM_VERSION=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_COMMIT }}
            org.opencontainers.image.version=${{ env.VERSION }}
      - name: Record release identity
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          data = dict(image=os.environ['IMAGE'], version=os.environ['VERSION'],
                      tag=os.environ['RELEASE_TAG'], digest=os.environ['DIGEST'],
                      source_commit=subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip())
          Path('release-image.json').write_text(json.dumps(data, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('```json\n' + json.dumps(data, indent=2) + '\n```\n')
          PY
      - name: Anonymous pull and offline smoke test
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          docker pull --platform linux/amd64 "$IMAGE@$DIGEST"
          docker run --rm --network none --user "$(id -u):$(id -g)" "$IMAGE@$DIGEST" --version
          docker run --rm --network none --user "$(id -u):$(id -g)" "$IMAGE@$DIGEST" --help
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-image
          path: release-image.json
          if-no-files-found: warn
